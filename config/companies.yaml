# Target company list for the discovery pipeline.
#
# ats:              greenhouse | lever | ashby   (smartrecruiters/workday not yet implemented)
# token:             the board slug — for Greenhouse it's the boards.greenhouse.io/{token} slug,
#                    for Lever it's the jobs.lever.co/{token} slug, for Ashby it's jobs.ashbyhq.com/{token}.
# target_countries:  INFORMATIONAL ONLY. This is what markets you expect this company's
#                    board to contain — it is NOT used to tag vacancies (that was a real bug
#                    in the first version: every job from a company got the company's config
#                    country regardless of its actual location). Real per-vacancy country is
#                    inferred from each job's own location text by
#                    ten_watch/pipeline/geography.py. Use target_countries as a note to
#                    yourself, or later as a mismatch check ("this board returned zero DE
#                    roles even though we expected some — check the token").
#
# The two entries below are REAL, LIVE company boards used only to prove the pipeline runs
# end-to-end. They are not EU27 companies and should be deleted once real Big-5 targets are
# populated below them.

companies:
  # --- demo/smoke-test entries (non-EU27, delete before real use) ---
  - company: Stripe
    ats: greenhouse
    token: stripe
    target_countries: ["US", "IE"]   # Stripe does have a Dublin office — good real test of
                                      # per-vacancy filtering actually working, not just the
                                      # config label.
  - company: Monzo
    ats: greenhouse
    token: monzo
    target_countries: ["GB"]

