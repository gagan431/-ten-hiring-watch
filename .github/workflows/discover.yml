name: Weekly Discovery Run

# Part VI, Phase 1: runs the automated discovery/flag/dedupe pipeline on a schedule
# and opens a PR with the new review queue. Nothing here classifies anything — a
# human reviews the CSV in the PR diff, fills in tier/access_mechanism/editorial_note
# etc. as commits on that branch, and merges when it's ready. GitHub's own PR review
# IS the human-review step from Part II.5 — no separate tool needed.

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC — start of the Part II.1 research window
  workflow_dispatch: {}   # manual trigger for testing / off-cycle runs

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery pipeline
        run: python -m ten_watch.pipeline.build_review_queue

      - name: Open PR with new review queue
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly discovery run: new review queue"
          title: "Review queue — week of ${{ github.run_id }}"
          body: |
            Automated discovery run. Nothing in this PR has been classified — every
            HUMAN field in the schema (tier, access_mechanism, profession, editorial_note...)
            is blank. Fill those in directly in this PR (edit the CSV, or check it out
            locally) and merge once each row has passed Gates 1-8 in docs/OPERATING_MODEL.md.
          branch: review/auto-${{ github.run_number }}
          add-paths: review/*.csv
