name: Weekly Discovery Run

# Phase 1: run discovery and open a PR containing both confirmed-EU27 review
# candidates and any access-signal roles whose geography still needs resolution.
# Nothing here classifies A/B/C/D; that remains human review.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run discovery pipeline
        run: python -m ten_watch.pipeline.build_review_queue

      - name: Open PR with new discovery queues
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Weekly discovery run: new review queues"
          title: "Review queue — week of ${{ github.run_id }}"
          body: |
            Automated discovery run.

            `review/queue-*.csv` contains only confirmed-EU27 vacancies with an
            immigration/access phrase match.

            `review/location-resolution-*.csv` contains phrase-matched vacancies whose
            geography is unknown or ambiguous and must be resolved before they can enter
            the EU27 human review queue.

            No A/B/C/D classification is automatic. Fill the human review fields and
            merge only after the relevant editorial gates are satisfied.
          branch: review/auto-${{ github.run_number }}
          base: main
          add-paths: |
            review/queue-*.csv
            review/location-resolution-*.csv
